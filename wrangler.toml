name = "visitor-map-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 1) Create a KV namespace:
#    npx wrangler kv namespace create visitor-cities
# 2) Paste the id below (replace YOUR_KV_NAMESPACE_ID)
[[kv_namespaces]]
binding = "VISITORS"
id = "YOUR_KV_NAMESPACE_ID"

# Send verification codes from samuelnkg.com via Cloudflare Email Service
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@samuelnkg.com"]

# Optional: lock CORS to your site
# [vars]
# ALLOWED_ORIGIN = "https://www.example.com"
# MAIL_FROM = "noreply@samuelnkg.com"
